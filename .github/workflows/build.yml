  package-x86-64-v3:
    needs: [mpv-x86-64-v3]
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Package
      run: |
        $date = Get-Date -Format "yyyyMMdd"
        $headers = @{ Authorization = "token $env:GITHUB_TOKEN" }
        foreach ($item in @(
          @{ tag = "bleeding_edge-x86-64-v3"; prefix = "ffmpeg-git-" },
          @{ tag = "bleeding_edge-x86-64-v3"; prefix = "mpv-git-" },
          @{ tag = "dev-x86-64-v3"; prefix = "luajit-dev-" },
          @{ tag = "latest-x86-64-v3"; prefix = "mcfgthread-" }
        )) {
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$($item.tag)" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "$($item.prefix)*x86_64.pkg.tar.*" } | Select-Object -First 1
          if (-not $asset) { Write-Error "$($item.prefix) not found in $($item.tag) release"; exit 1 }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $asset.name
        }
        C:\msys64\usr\bin\bash -lc "pacman -U /d/a/mpv-win64/mpv-win64/*.xz --noconfirm"
        md C:\msys64\opt\bin\portable_config
        del *.xz
        7z a All-in-One-MPV-git-$date.7z C:\msys64\opt\bin\*
        copy All-in-One-MPV-git-$date.7z All-in-One-MPV-git-latest.7z
    - name: Upload
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: All*.7z
        tag: bleeding_edge-x86-64-v3
        overwrite: true
        file_glob: true
