        file_glob: true
  libass-x86-64-v3:
    needs: [freetype2-x86-64-v3, fribidi-x86-64-v3, harfbuzz-x86-64-v3]
    runs-on: windows-latest
    steps:
    - uses: actions/cache@v5
      id: cache
      with:
        path: D:\msys64
        key: mcfgthread_20260702_16.1.1_x64-ucrt
    - name: Prepare
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v6
    - name: Build
      env:
        C_INCLUDE_PATH: /opt/include
        CPLUS_INCLUDE_PATH: /opt/include
        LIBRARY_PATH: /opt/lib
        MSYSTEM: UCRT64
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Download latest freetype2-dev from dev-x86-64-v3 release
        ASSET_URL=$(curl -sL -H "Authorization: token ${{${{ secrets.GITHUB_TOKEN }}}}" "https://api.github.com/repos/${{ github.repository }}/releases/tags/dev-x86-64-v3" | python -c "import sys,json; [print(a['browser_download_url']) for a in json.load(sys.stdin).get('assets',[]) if a['name'].startswith('freetype2-dev-')]" | head -1)
        if [ -z "$ASSET_URL" ]; then echo "ERROR: freetype2-dev not found in dev-x86-64-v3 release"; exit 1; fi
        curl -OL "$ASSET_URL"
        # Download latest fribidi-dev from dev-x86-64-v3 release
        ASSET_URL=$(curl -sL -H "Authorization: token ${{${{ secrets.GITHUB_TOKEN }}}}" "https://api.github.com/repos/${{ github.repository }}/releases/tags/dev-x86-64-v3" | python -c "import sys,json; [print(a['browser_download_url']) for a in json.load(sys.stdin).get('assets',[]) if a['name'].startswith('fribidi-dev-')]" | head -1)
        if [ -z "$ASSET_URL" ]; then echo "ERROR: fribidi-dev not found in dev-x86-64-v3 release"; exit 1; fi
        curl -OL "$ASSET_URL"
        # Download latest harfbuzz-dev from dev-x86-64-v3 release
        ASSET_URL=$(curl -sL -H "Authorization: token ${{${{ secrets.GITHUB_TOKEN }}}}" "https://api.github.com/repos/${{ github.repository }}/releases/tags/dev-x86-64-v3" | python -c "import sys,json; [print(a['browser_download_url']) for a in json.load(sys.stdin).get('assets',[]) if a['name'].startswith('harfbuzz-dev-')]" | head -1)
        if [ -z "$ASSET_URL" ]; then echo "ERROR: harfbuzz-dev not found in dev-x86-64-v3 release"; exit 1; fi
        curl -OL "$ASSET_URL"
        D:\msys64\usr\bin\bash -lc "pacman -U /d/a/mpv-win64/mpv-win64/*.zst --noconfirm"
        D:\msys64\usr\bin\bash -lc 'cp /d/a/mpv-win64/mpv-win64/x86-64-v3.conf /etc/makepkg.conf; cd /d/a/mpv-win64/mpv-win64/libass-dev; PATH=/usr/bin:/opt/bin:/ucrt64/bin PKG_CONFIG_PATH=/opt/lib/pkgconfig makepkg '
    - name: Delete
      uses: mknejp/delete-release-assets@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: dev-x86-64-v3
        assets: libass*
        fail-if-no-assets: false
        fail-if-no-release: false
    - name: Upload
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: libass-dev/libass*.zst
        tag: dev-x86-64-v3
        overwrite: true
        file_glob: true
  libjxl-x86-64-v3:
    needs: [brotli-x86-64-v3, highway-x86-64-v3, lcms2-x86-64-v3]
    runs-on: windows-latest
